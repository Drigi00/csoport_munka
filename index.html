<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Webáruház</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-4">

  <h1 class="mb-4">Webáruház</h1>

  <div class="row">

  
    <div class="col-lg-3 mb-4">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Keresési feltételek</h6>

          <div class="mb-3">
            <label class="form-label">A termék neve</label>
            <input type="text" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Szűrés ár szerint</label>
            <input type="range" class="form-range">
          </div>
        </div>
      </div>
    </div>

   
    <div class="col-lg-6 mb-4">
      <div class="row g-4">

       
        <div class="col-md-6">
          <div class="card h-100">
            <img src="/kepek/kepek/polo1.jpg" alt="polo">
            <div class="image-placeholder"></div>
            <div class="card-body">
              <h6 class="card-title">Retro Gamer férfi póló</h6>

              <p class="small mb-2">
                100% pamut, tartós nyomat.
              </p>

              <p class="small mb-2">
                <span class="border px-1">S</span>
                <span class="border px-1">M</span>
                <span class="border px-1">L</span>
                <span class="border px-1">XL</span>
              </p>

              <p class="fw-bold mb-2">6 990 Ft</p>

              <button class="btn btn-success btn-sm w-100">
                Kosárba
              </button>
            </div>
          </div>
        </div>

        
        <div class="col-md-6">
          <div class="card h-100">
            <img src="/kepek/kepek/polo2.jpg" alt="polo">
            <div class="image-placeholder"></div>
            <div class="card-body">
              <h6 class="card-title">Túléltem még egy meetinget</h6>

              <p class="small mb-2">
                Prémium póló, humoros felirat.
              </p>

              <p class="small mb-2">
                <span class="border px-1">M</span>
                <span class="border px-1">L</span>
                <span class="border px-1">XL</span>
              </p>

              <p class="fw-bold mb-2">6 990 Ft</p>

              <button class="btn btn-success btn-sm w-100">
                Kosárba
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    

    
    <div class="col-lg-3">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Kapcsolódó cikkek</h6>
          <ol class="small mb-0">
            <li>Lorem ipsum dolor sit amet</li>
            <li>Accusamus nemo</li>
            <li>Aspernatur eos</li>
          </ol>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
